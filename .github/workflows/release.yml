name: Desktop release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: darwin-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure tagged version and updater bundles
        run: python scripts/release-assets.py configure
      - name: Check signing configuration
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != "true" ]]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret before pushing a release tag"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run desktop:build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config release.conf.json
      - run: python scripts/release-assets.py stage ${{ matrix.platform }} src-tauri/target/${{ matrix.target }}/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify all six signatures and generate latest.json
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          python scripts/release-assets.py manifest release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo "::error::This release is already public"; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "Vovis ${TAG#v}"
          fi
          gh release upload "$TAG" release-assets/* --clobber
          id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=legacy --silent
