name: Desktop release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: darwin-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure tagged version and updater bundles
        run: python scripts/release-assets.py configure
      - name: Check signing configuration
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != "true" ]]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret before pushing a release tag"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - run: npm test
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run desktop:build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config release.conf.json
      - name: Verify macOS app bundle signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Vovis.app"
      - name: Verify Linux GLIBC baseline including bundled libraries
        if: runner.os == 'Linux'
        run: python scripts/check-linux-glibc.py src-tauri/target/${{ matrix.target }}/release/bundle
      - run: python scripts/release-assets.py stage ${{ matrix.platform }} src-tauri/target/${{ matrix.target }}/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify all package signatures and generate latest.json
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          python scripts/release-assets.py manifest release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS_REF: ${{ github.event.before }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          [[ "$current" == "$(git rev-parse HEAD)" ]] || { echo "::error::Release tag has moved"; exit 1; }
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              [[ "$PREVIOUS_REF" =~ ^[0-9a-f]{40}$ && ! "$PREVIOUS_REF" =~ ^0+$ ]] || { echo "::error::Republishing requires updating the existing tag"; exit 1; }
            fi
          else
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" > "$RUNNER_TEMP/release-notes"
            gh release create "$TAG" --verify-tag --draft --generate-notes --notes-file "$RUNNER_TEMP/release-notes" --title "Vovis ${TAG#v}"
          fi
          gh release upload "$TAG" release-assets/Vovis-* --clobber
          gh release upload "$TAG" release-assets/latest.json --clobber
          if [[ "${draft:-}" == false ]]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" > "$RUNNER_TEMP/rebuild-note"
            gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/previous-notes"
            if grep -q '[^[:space:]]' "$RUNNER_TEMP/rebuild-note" && ! grep -Fqx -- "$(head -1 "$RUNNER_TEMP/rebuild-note")" "$RUNNER_TEMP/previous-notes"; then
              cat "$RUNNER_TEMP/rebuild-note" "$RUNNER_TEMP/previous-notes" > "$RUNNER_TEMP/release-notes"
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes"
            fi
            exit 0
          fi
          id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=legacy --silent
