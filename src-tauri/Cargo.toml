[package]
name = "vovis"
version = "0.2.0"
description = "Vovis presentation workspace"
authors = ["Vovis"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "vovis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

base64 = "0.22"
tokio = { version = "1", features = ["sync", "macros", "net", "io-util", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi"] }
